name: Deploy to GitHub Pages

# Publishes the app (plus ffmpeg.wasm for extra formats) to
# https://<user>.github.io/<repo>/. Enable it once under
# Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Bundle ffmpeg.wasm
        run: sh tools/fetch-ffmpeg.sh
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
